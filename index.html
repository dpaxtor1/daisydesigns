  <div id="__bundler_placeholder">Loading Daisy Designs – Websites for businesses...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ration: none; padding: 10px 0\">Pricing<\u002Fa>\n<a href=\"#process\" style=\"text-decoration: none; padding: 10px 0\">How it works<\u002Fa>\n<a href=\"#about\" style=\"text-decoration: none; padding: 10px 0\">About<\u002Fa>\n<a href=\"#faq\" style=\"text-decoration: none; padding: 10px 0\">FAQ<\u002Fa>\n<a href=\"#contact\" style=\"text-decoration: none; background: #1F2A24; color: #FFFFFF; padding: 12px 20px; border-radius: 999px; font-weight: 600\">Get started<\u002Fa>\n<\u002Fdiv>\n<\u002Fnav>\n<\u002Fheader>\n\n<section id=\"top\" style=\"max-width: 1200px; margin: 0 auto; padding: clamp(56px, 9vw, 120px) clamp(20px, 4vw, 48px) clamp(56px, 8vw, 104px); display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 56px; align-items: center\">\n<div style=\"display: flex; flex-direction: column; gap: 24px\">\n<p style=\"margin: 0; font-weight: 600; font-size: 0.95rem; letter-spacing: 0.06em; text-transform: uppercase; color: #4B5550\">Web design for businesses · Los Angeles<\u002Fp>\n<h1 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 900; font-size: clamp(2.6rem, 5.6vw, 4.6rem); line-height: 1.02; letter-spacing: -0.03em; max-width: 16ch\">Let me help scale your business<span style=\"color: {{accent}}\">.<\u002Fspan><\u002Fh1>\n<p style=\"margin: 0; font-size: 1.2rem; color: #4B5550; max-width: 34rem\">I’m Daisy. I design clean, mobile-friendly websites for service businesses, product sellers and restaurants. Whenever I can, I host your site for free on GitHub, so you’re not stuck with monthly fees.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n<a href=\"#contact\" style=\"text-decoration: none; background: #1F2A24; color: #FFFFFF; padding: 16px 26px; border-radius: 999px; font-weight: 600\">Get started<\u002Fa>\n<a href=\"#pricing\" style=\"text-decoration: none; border: 2px solid #1F2A24; padding: 14px 24px; border-radius: 999px; font-weight: 600\">See pricing<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"free\" style=\"background: #FFFFFF; padding: 0 0 clamp(56px, 7vw, 88px)\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 48px)\">\n<div style=\"background: {{accent}}; color: #1F2A24; border-radius: 28px; padding: clamp(28px, 4vw, 48px); display: flex; flex-direction: column; gap: 20px\">\n<p style=\"margin: 0; font-weight: 700; font-size: 0.95rem; letter-spacing: 0.06em; text-transform: uppercase\">Limited offer<\u002Fp>\n<h2 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 900; font-size: clamp(1.9rem, 4vw, 2.9rem); line-height: 1.05; letter-spacing: -0.02em; max-width: 22ch\">Free websites for 3 businesses, while spots last<\u002Fh2>\n<p style=\"margin: 0; font-size: 1.1rem; max-width: 52rem\">I’m building my portfolio and offering three free websites: one service business, one restaurant, and one online store. I’ll design and build your site at no cost. The only exceptions are services you’d pay for directly, like a domain, a booking app, Shopify, or card processing fees, and those stay in your name.<\u002Fp>\n<p style=\"margin: 0; font-size: 1.1rem; max-width: 52rem\">In return, I’d ask to feature your site in my portfolio and for a referral if you know someone who needs a website. Once a spot is taken, it’s gone.<\u002Fp>\n<ul style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px\">\n<sc-for list=\"{{ spots }}\" as=\"spot\" hint-placeholder-count=\"3\">\n<li style=\"background: #FFFFFF; border-radius: 16px; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px\">\n<span style=\"font-weight: 700\">{{ spot.label }}<\u002Fspan>\n<sc-if value=\"{{ spot.open }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"flex: none; background: #E3F1E6; color: #1E5631; border-radius: 999px; padding: 4px 12px; font-size: 0.88rem; font-weight: 700\">Available<\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{ spot.taken }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"flex: none; background: #1F2A24; color: #FFFFFF; border-radius: 999px; padding: 4px 12px; font-size: 0.88rem; font-weight: 700\">Taken<\u002Fspan><\u002Fsc-if>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Ful>\n<div style=\"background: #FFFFFF; border-radius: 16px; padding: 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px; max-width: 34rem\">\n<p style=\"margin: 0; font-weight: 700; font-size: 1.1rem\">Want a spot? Tap the button to text me.<\u002Fp>\n<p style=\"margin: 0; color: #4B5550\">It opens your messages with a short template already typed: FREE SPOT, Business name, and Type of site. Fill it in and choose whether to send it. On a computer? Text (213) 284-2154.<\u002Fp>\n<\u002Fdiv>\n<a href=\"sms:+12132842154?&amp;body=FREE%20SPOT%0ABusiness%20name%3A%20%0AType%20of%20site%3A%20\" aria-label=\"Text FREE SPOT to (213) 284-2154\" style=\"flex: none; text-decoration: none; background: #1F2A24; color: #FFFFFF; padding: 16px 26px; border-radius: 999px; font-weight: 600; font-size: 1.05rem; display: inline-flex; align-items: center; gap: 10px\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z\"><\u002Fpath><\u002Fsvg>Text FREE SPOT<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"services\" style=\"background: #F7F5EE; padding: clamp(64px, 8vw, 104px) 0\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 48px); display: flex; flex-direction: column; gap: 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; max-width: 44rem\">\n<h2 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 900; font-size: clamp(2rem, 4vw, 3rem); line-height: 1.05; letter-spacing: -0.02em\">What I build<\u002Fh2>\n<p style=\"margin: 0; color: #4B5550; font-size: 1.15rem\">From a bookkeeper’s booking page to a clothing store to a restaurant with online ordering, I pick the right tool for your business, not the fanciest one.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px\">\n\n<article style=\"background: #FFFFFF; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1F2A24\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\u002Fcircle><path d=\"M4 21a8 8 0 0 1 16 0\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 800; font-size: 1.3rem\">Portfolios<\u002Fh3>\n<p style=\"margin: 0; color: #4B5550\">Artists, photographers, students and anyone who wants a simple page that shows their work and who they are. Clean, quick to launch, and free to host.<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background: #FFFFFF; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1F2A24\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"17\" rx=\"2\"><\u002Frect><path d=\"M3 9h18M8 2v4M16 2v4\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 800; font-size: 1.3rem\">Service businesses<\u002Fh3>\n<p style=\"margin: 0; color: #4B5550\">Tattoo shops, barbershops, salons, bookkeepers and consultants. A clear site, on one page or several, with a contact form and a “Book now” button linked to the booking app you already use (Square Appointments, Booksy, Vagaro), so you never have to switch. For tax documents and financial records, I’ll point you to a secure client portal instead of your website.<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background: #FFFFFF; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1F2A24\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z\"><\u002Fpath><path d=\"M14 3v6h6M12 12v6M9 15l3 3 3-3\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 800; font-size: 1.3rem\">Digital products<\u002Fh3>\n<p style=\"margin: 0; color: #4B5550\">Guides, templates and downloads. Customers pay by card or Apple Pay through Payhip, and their file is delivered automatically. You don’t have to email anything.<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background: #FFFFFF; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1F2A24\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 7h12l-1 13H7z\"><\u002Fpath><path d=\"M9 7a3 3 0 0 1 6 0\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 800; font-size: 1.3rem\">Physical products &amp; clothing<\u002Fh3>\n<p style=\"margin: 0; color: #4B5550\">A real online store on Shopify with sizes, inventory, shipping and an add-to-cart button. I build it for you, then transfer full ownership to you.<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background: #FFFFFF; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1F2A24\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 0-3 3-3 6s1 4 3 4v8\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 800; font-size: 1.3rem\">Restaurants<\u002Fh3>\n<p style=\"margin: 0; color: #4B5550\">Menu, hours and directions, plus a big “Order Online” button that sends orders straight to the counter system your kitchen already uses. Uber Eats and DoorDash buttons too.<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background: #FFFFFF; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1F2A24\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 800; font-size: 1.3rem\">Domains, launch &amp; Google<\u002Fh3>\n<p style=\"margin: 0; color: #4B5550\">I’ll help you buy your own domain in your own account, connect it, and turn on the secure padlock (HTTPS) so customers trust your site. I can also set up a professional Google Business Profile with your hours, address, phone, website link and the photos you provide, so you show up on Google Search and Maps.<\u002Fp>\n<p style=\"margin: 0; align-self: flex-start; background: #F7F5EE; border-radius: 999px; padding: 6px 14px; font-size: 0.92rem; font-weight: 600\">Included · optional<\u002Fp>\n<\u002Farticle>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"why\" style=\"background: #FFFFFF; padding: clamp(64px, 8vw, 104px) 0\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 48px); display: flex; flex-direction: column; gap: 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; max-width: 44rem\">\n<h2 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 900; font-size: clamp(2rem, 4vw, 3rem); line-height: 1.05; letter-spacing: -0.02em\">Why work with me<span style=\"color: {{accent}}\">?<\u002Fspan><\u002Fh2>\n<p style=\"margin: 0; color: #4B5550; font-size: 1.15rem\">A good website shouldn’t be stressful or overpriced. Here’s what you can count on.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px\">\n<article style=\"background: #F7F5EE; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 10px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1F2A24\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 21s-7-4.5-7-11a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 6.5-7 11-7 11z\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 800; font-size: 1.25rem\">You work directly with me<\u002Fh3>\n<p style=\"margin: 0; color: #4B5550\">No hand-offs, no call centers. The person you meet at your first consultation is the person who designs, builds and launches your site.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #F7F5EE; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 10px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1F2A24\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 7h16M4 12h16M4 17h10\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 800; font-size: 1.25rem\">Fair, fixed quotes<\u002Fh3>\n<p style=\"margin: 0; color: #4B5550\">You know the full price before any work starts, and every extra is listed on this page. No surprise bills.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #F7F5EE; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 10px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1F2A24\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"7\" y=\"2\" width=\"10\" height=\"20\" rx=\"2\"><\u002Frect><path d=\"M11 18h2\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 800; font-size: 1.25rem\">Made for phones<\u002Fh3>\n<p style=\"margin: 0; color: #4B5550\">Most customers will find you on their phone. Every site is mobile-friendly, fast, and easy to read, with strong contrast and descriptions on every image.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #F7F5EE; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 10px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1F2A24\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"11\" rx=\"2\"><\u002Frect><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 800; font-size: 1.25rem\">Safe by design<\u002Fh3>\n<p style=\"margin: 0; color: #4B5550\">Payments and private information always go through trusted services like Payhip, Shopify or Square, never a homemade form.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #F7F5EE; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 10px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1F2A24\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 7h4v4M19 7l-7 7M5 5h5M5 19h14v-5\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 800; font-size: 1.25rem\">You own everything<\u002Fh3>\n<p style=\"margin: 0; color: #4B5550\">Your domain, your accounts, your store. They’re in your name from day one, and the website is officially yours at launch.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #F7F5EE; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 10px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1F2A24\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"13\" r=\"4\"><\u002Fcircle><path d=\"M4 8h3l2-3h6l2 3h3v11H4z\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 800; font-size: 1.25rem\">Everything in one place<\u002Fh3>\n<p style=\"margin: 0; color: #4B5550\">Website, photos and your Google Business Profile, all from one person. No juggling three different freelancers.<\u002Fp>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"pricing\" style=\"background: #1F2A24; color: #FFFFFF; padding: clamp(64px, 8vw, 104px) 0\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 48px); display: flex; flex-direction: column; gap: 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; max-width: 46rem\">\n<h2 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 900; font-size: clamp(2rem, 4vw, 3rem); line-height: 1.05; letter-spacing: -0.02em\">Pricing<\u002Fh2>\n<p style=\"margin: 0; color: #D9DED9; font-size: 1.15rem\">One-time prices for the design and build. Most sites are hosted free on GitHub Pages, so there’s no monthly bill. You’ll get a fixed quote after our planning consultation, so there are no surprises, and every build includes two rounds of revisions.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px\">\n\n<div style=\"background: #FFFFFF; color: #1F2A24; border-radius: 20px; padding: 26px; display: flex; flex-direction: column; gap: 10px\">\n<h3 style=\"margin: 0; font-size: 1.1rem; font-weight: 700\">One-Page Site<\u002Fh3>\n<p style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 900; font-size: 2.4rem; line-height: 1\">$100<\u002Fp>\n<p style=\"margin: 0; color: #4B5550; font-size: 0.98rem\">A simple portfolio that shows who you are and what you do. One scrolling page with links to your Instagram and other free profiles.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"background: #FFFFFF; color: #1F2A24; border-radius: 20px; padding: 26px; display: flex; flex-direction: column; gap: 10px\">\n<h3 style=\"margin: 0; font-size: 1.1rem; font-weight: 700\">Service Business<\u002Fh3>\n<p style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 900; font-size: 2.4rem; line-height: 1\">$550<\u002Fp>\n<p style=\"margin: 0; color: #4B5550; font-size: 0.98rem\">One page or several, your choice. Includes a contact form, plus a link to your booking app if you use one.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"background: #FFFFFF; color: #1F2A24; border-radius: 20px; padding: 26px; display: flex; flex-direction: column; gap: 10px\">\n<h3 style=\"margin: 0; font-size: 1.1rem; font-weight: 700\">Digital Products<\u002Fh3>\n<p style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 900; font-size: 2.4rem; line-height: 1\">$650<\u002Fp>\n<p style=\"margin: 0; color: #4B5550; font-size: 0.98rem\">Site plus Payhip checkout with as many products as you need and automatic delivery.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"background: #FFFFFF; color: #1F2A24; border-radius: 20px; padding: 26px; display: flex; flex-direction: column; gap: 10px\">\n<h3 style=\"margin: 0; font-size: 1.1rem; font-weight: 700\">Restaurant<\u002Fh3>\n<p style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 900; font-size: 2.4rem; line-height: 1\">$800<\u002Fp>\n<p style=\"margin: 0; color: #4B5550; font-size: 0.98rem\">Menu, hours, map, Order Online button, plus Uber Eats and DoorDash buttons.<\u002Fp>\n<p style=\"margin: 0; color: #4B5550; font-size: 0.88rem\">Linking your existing online ordering is included. Setting up online ordering from scratch is quoted separately.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"background: {{accent}}; color: #1F2A24; border-radius: 20px; padding: 26px; display: flex; flex-direction: column; gap: 10px\">\n<h3 style=\"margin: 0; font-size: 1.1rem; font-weight: 700\">Online Store<\u002Fh3>\n<p style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 900; font-size: 2.4rem; line-height: 1\">from $1,200<\u002Fp>\n<p style=\"margin: 0; color: #1F2A24; font-size: 0.98rem\">Shopify store with as many products as you need, plus sizes, inventory and shipping.<\u002Fp>\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; max-width: 720px\">\n<div style=\"border: 1px solid #4A5650; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<h3 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 800; font-size: 1.3rem\">How payment works<\u002Fh3>\n<p style=\"margin: 0; color: #D9DED9\"><strong style=\"color: #FFFFFF\">50% down payment<\u002Fstrong> after our planning consultation to book your spot. <strong style=\"color: #FFFFFF\">50% at launch<\u002Fstrong>, before hand-off.<\u002Fp>\n<p style=\"margin: 0; color: #D9DED9\">I accept <strong style=\"color: #FFFFFF\">Zelle<\u002Fstrong> or <strong style=\"color: #FFFFFF\">cash<\u002Fstrong>. Zelle details are on your invoice.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"photos\" style=\"background: #F7F5EE; padding: clamp(64px, 8vw, 104px) 0\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 48px)\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 46rem\">\n<p style=\"margin: 0; font-weight: 600; font-size: 0.95rem; letter-spacing: 0.06em; text-transform: uppercase; color: #4B5550\">Photography · Included where it fits<\u002Fp>\n<h2 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 900; font-size: clamp(2rem, 4vw, 3rem); line-height: 1.05; letter-spacing: -0.02em\">Real photos of your real team<span style=\"color: {{accent}}\">.<\u002Fspan><\u002Fh2>\n<p style=\"margin: 0; font-size: 1.15rem\">Stock photos all look the same. I come to you with a professional camera and photograph your team members and your building, inside and out.<\u002Fp>\n<p style=\"margin: 0; font-size: 1.05rem\">Photos come with your package wherever they help: a headshot for portfolios; team, space and menu photos for restaurants and service businesses; and a reasonable set of product photos for online stores. For digital products, you provide your own files and covers.<\u002Fp>\n<p style=\"margin: 0; color: #4B5550\">Customers want to see who they’ll meet and what your place looks like before they walk in. Your own photos build that trust, and you can use them on Instagram, Google Maps and flyers too.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"extras\" style=\"padding: clamp(64px, 8vw, 104px) 0\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 48px); display: flex; flex-direction: column; gap: 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; max-width: 46rem\">\n<h2 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 900; font-size: clamp(2rem, 4vw, 3rem); line-height: 1.05; letter-spacing: -0.02em\">Extra costs<\u002Fh2>\n<p style=\"margin: 0; color: #4B5550; font-size: 1.15rem\">Your package covers all my work. These are the only other costs, paid directly to each service from your own accounts, so you can budget honestly. The one optional extra from me is maintenance, further down.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; max-width: 760px\">\n\n<div style=\"background: #F7F5EE; border-radius: 20px; padding: 30px; display: flex; flex-direction: column; gap: 16px\">\n<h3 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 800; font-size: 1.3rem\">Paid by you, to the service<\u002Fh3>\n<p style=\"margin: 0; color: #4B5550; font-size: 0.98rem\">These go in your own accounts, so you always stay in control.<\u002Fp>\n<dl style=\"margin: 0; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; border-bottom: 1px solid #E2DED0; padding-bottom: 12px\"><dt style=\"font-weight: 600\">Your own domain (yourbusiness.com)<\u002Fdt><dd style=\"margin: 0\">about $10–15 / year<\u002Fdd><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; border-bottom: 1px solid #E2DED0; padding-bottom: 12px\"><dt style=\"font-weight: 600\">Shopify Basic (online stores)<\u002Fdt><dd style=\"margin: 0\">$39/mo, or $29/mo billed yearly<\u002Fdd><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; border-bottom: 1px solid #E2DED0; padding-bottom: 12px\"><dt style=\"font-weight: 600\">Payhip (digital products)<\u002Fdt><dd style=\"margin: 0\">free plan + 5% per sale<\u002Fdd><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; border-bottom: 1px solid #E2DED0; padding-bottom: 12px\"><dt style=\"font-weight: 600\">Card processing fees<\u002Fdt><dd style=\"margin: 0\">set by Stripe, Square, etc.<\u002Fdd><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px\"><dt style=\"font-weight: 600\">Online ordering &amp; booking tools<\u002Fdt><dd style=\"margin: 0\">varies by plan<\u002Fdd><\u002Fdiv>\n<\u002Fdl>\n<\u002Fdiv>\n\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"process\" style=\"background: #F7F5EE; padding: clamp(64px, 8vw, 104px) 0\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 48px); display: flex; flex-direction: column; gap: 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; max-width: 44rem\">\n<h2 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 900; font-size: clamp(2rem, 4vw, 3rem); line-height: 1.05; letter-spacing: -0.02em\">How it works<\u002Fh2>\n<p style=\"margin: 0; color: #4B5550; font-size: 1.15rem\">Two consultations, so your site sounds like you and nothing gets lost along the way.<\u002Fp>\n<\u002Fdiv>\n<ol style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px\">\n<li style=\"border-top: 3px solid #1F2A24; padding-top: 18px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-family: Archivo, Inter, Arial, sans-serif; font-weight: 900; font-size: 2rem\">01<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 1.15rem; font-weight: 700\">Text me<\u002Fh3>\n<p style=\"margin: 0; color: #4B5550\">Send me your business name, the package you’re interested in, and when you’d like to launch. I’ll reply within 2 business days.<\u002Fp>\n<\u002Fli>\n<li style=\"border-top: 3px solid #1F2A24; padding-top: 18px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-family: Archivo, Inter, Arial, sans-serif; font-weight: 900; font-size: 2rem\">02<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 1.15rem; font-weight: 700\">Planning consultation<\u002Fh3>\n<p style=\"margin: 0; color: #4B5550\">We talk about your customers, goals, colors and content, and set up your accounts together, with you typing your own passwords. You receive a fixed quote, and the down payment books your spot.<\u002Fp>\n<\u002Fli>\n<li style=\"border-top: 3px solid #1F2A24; padding-top: 18px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-family: Archivo, Inter, Arial, sans-serif; font-weight: 900; font-size: 2rem\">03<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 1.15rem; font-weight: 700\">Design &amp; build<\u002Fh3>\n<p style=\"margin: 0; color: #4B5550\">I design your site and build a private preview you can open on your phone.<\u002Fp>\n<\u002Fli>\n<li style=\"border-top: 3px solid #1F2A24; padding-top: 18px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-family: Archivo, Inter, Arial, sans-serif; font-weight: 900; font-size: 2rem\">04<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 1.15rem; font-weight: 700\">Review consultation<\u002Fh3>\n<p style=\"margin: 0; color: #4B5550\">We walk through the preview together. Your build includes two rounds of revisions: you send me one list of changes, I update the site, and then we do it once more.<\u002Fp>\n<\u002Fli>\n<li style=\"border-top: 3px solid {{accent}}; padding-top: 18px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-family: Archivo, Inter, Arial, sans-serif; font-weight: 900; font-size: 2rem\">05<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 1.15rem; font-weight: 700\">Launch &amp; hand-off<\u002Fh3>\n<p style=\"margin: 0; color: #4B5550\">I test everything, take your site live, and you pay the final balance. Then I make you an Owner of your website on GitHub, so it’s officially yours.<\u002Fp>\n<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"care\" style=\"background: #FFFFFF; padding: clamp(64px, 8vw, 104px) 0\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 48px); display: flex; flex-direction: column; gap: 32px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; max-width: 46rem\">\n<h2 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 900; font-size: clamp(2rem, 4vw, 3rem); line-height: 1.05; letter-spacing: -0.02em\">After launch: maintenance<\u002Fh2>\n<p style=\"margin: 0; color: #4B5550; font-size: 1.15rem\">Totally optional. Sites on GitHub Pages have no software to update, so they don’t break on their own. Maintenance just means keeping your info current, and you only pay when you need something.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #1F2A24; color: #FFFFFF; border-radius: 20px; padding: 30px; display: flex; flex-direction: column; gap: 14px; max-width: 640px\">\n<h3 style=\"margin: 0; font-size: 1.1rem; font-weight: 700\">Pay as you go<\u002Fh3>\n<p style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 900; font-size: 2.2rem; line-height: 1\">$30<span style=\"font-family: Inter, Arial, sans-serif; font-weight: 500; font-size: 1rem\"> / hour<\u002Fspan><\u002Fp>\n<p style=\"margin: 0; color: #D9DED9; font-size: 0.98rem\">No monthly fee. Text me when you need something, and I’ll send an estimate before I start. 30-minute minimum. Common updates include:<\u002Fp>\n<ul style=\"margin: 0; padding-left: 20px; color: #D9DED9; font-size: 0.98rem; display: flex; flex-direction: column; gap: 6px\">\n<li>Hours, prices, menu items, photos and text<\u002Fli>\n<li>Holiday sales, seasonal promotions and announcements<\u002Fli>\n<li>Changes beyond your two included revision rounds<\u002Fli>\n<\u002Ful>\n<p style=\"margin: 0; color: #D9DED9; font-size: 0.92rem\">Maintenance covers your website only.<\u002Fp>\n<\u002Fdiv>\n<p style=\"margin: 0; color: #4B5550; font-size: 0.95rem\">New pages, redesigns and new features are quoted separately. Service fees, like your domain or Shopify, are paid by you directly.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"about\" style=\"background: #F7F5EE; padding: clamp(64px, 8vw, 104px) 0\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 48px); display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 56px; align-items: center\">\n<img src=\"b9be359f-93e9-4d2e-a6c7-25ae7b8c503d\" alt=\"Daisy smiling and holding a graduation stole up high in front of a UC Berkeley building\" style=\"display: block; max-width: 440px; width: 100%; height: auto; border-radius: 28px\">\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n<h2 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 900; font-size: clamp(2rem, 4vw, 3rem); line-height: 1.05; letter-spacing: -0.02em\">How it all started<\u002Fh2>\n<p style=\"margin: 0; font-size: 1.15rem\">Hi, I’m Daisy. I learned how to build websites at UC Berkeley, and I was hooked the first time something I made showed up live on a phone screen.<\u002Fp>\n<p style=\"margin: 0; color: #4B5550\">Since then, I’ve built websites for friends, for school projects and just for fun. Now I’m ready to bring that same care to businesses like yours.<\u002Fp>\n<p style=\"margin: 0; color: #4B5550\">When I looked around, I noticed that most web design was really expensive. So Daisy Designs offers quality work at reasonable prices. I also keep things simple: tech can feel complicated, so I explain every step in plain language.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"faq\" style=\"background: #FFFFFF; padding: clamp(64px, 8vw, 104px) 0\">\n<div style=\"max-width: 820px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 48px); display: flex; flex-direction: column; gap: 28px\">\n<h2 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 900; font-size: clamp(2rem, 4vw, 3rem); line-height: 1.05; letter-spacing: -0.02em\">Questions<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 22px\">\n<div style=\"border-bottom: 1px solid #E2DED0; padding-bottom: 20px\"><h3 style=\"margin: 0 0 6px; font-size: 1.15rem; font-weight: 700\">Who owns my website?<\u002Fh3><p style=\"margin: 0; color: #4B5550\">You do. We set up your accounts together, in your name and with your email, and you create your own passwords. Your website lives in its own GitHub organization, and at launch I make you an Owner of it. I stay on only as a helper, and I never need your passwords.<\u002Fp><\u002Fdiv>\n<div style=\"border-bottom: 1px solid #E2DED0; padding-bottom: 20px\"><h3 style=\"margin: 0 0 6px; font-size: 1.15rem; font-weight: 700\">How long does it take?<\u002Fh3><p style=\"margin: 0; color: #4B5550\">Often about a week from our planning consultation to launch. It can take longer if we schedule a photo session, or while I wait on answers, text or photos from you.<\u002Fp><\u002Fdiv>\n<div style=\"border-bottom: 1px solid #E2DED0; padding-bottom: 20px\"><h3 style=\"margin: 0 0 6px; font-size: 1.15rem; font-weight: 700\">What do I need to get started?<\u002Fh3><p style=\"margin: 0; color: #4B5550\">Just a quick text. If you have a logo, photos or menu, great. If not, we’ll figure it out together in our planning consultation.<\u002Fp><\u002Fdiv>\n<div style=\"border-bottom: 1px solid #E2DED0; padding-bottom: 20px\"><h3 style=\"margin: 0 0 6px; font-size: 1.15rem; font-weight: 700\">Can I update the site myself?<\u002Fh3><p style=\"margin: 0; color: #4B5550\">Things like your Shopify products, booking app and Google profile, yes. Each has an easy dashboard, and I’ll show you how. Changes to the website itself are quickest through me.<\u002Fp><\u002Fdiv>\n<div><h3 style=\"margin: 0 0 6px; font-size: 1.15rem; font-weight: 700\">Can customers pay me through the site?<\u002Fh3><p style=\"margin: 0; color: #4B5550\">Yes, through trusted services like Payhip, Shopify, Square or Toast. They handle the cards securely, so your customers’ details never touch your website.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section ear site, on one page or several, with a contact form and a “Book now” button linked to the booking app you already use (Square Appointments, Booksy, Vagaro), so you never have to switch. For tax documents and financial records, I’ll point you to a secure client portal instead of your website.<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background: #FFFFFF; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1F2A24\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z\"><\u002Fpath><path d=\"M14 3v6h6M12 12v6M9 15l3 3 3-3\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 800; font-size: 1.3rem\">Digital products<\u002Fh3>\n<p style=\"margin: 0; color: #4B5550\">Guides, templates and downloads. Customers pay by card or Apple Pay through Payhip, and their file is delivered automatically. You don’t have to email anything.<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background: #FFFFFF; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1F2A24\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 7h12l-1 13H7z\"><\u002Fpath><path d=\"M9 7a3 3 0 0 1 6 0\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 800; font-size: 1.3rem\">Physical products &amp; clothing<\u002Fh3>\n<p style=\"margin: 0; color: #4B5550\">A real online store on Shopify with sizes, inventory, shipping and an add-to-cart button. I build it for you, then transfer full ownership to you.<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background: #FFFFFF; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1F2A24\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 0-3 3-3 6s1 4 3 4v8\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 800; font-size: 1.3rem\">Restaurants<\u002Fh3>\n<p style=\"margin: 0; color: #4B5550\">Menu, hours and directions, plus a big “Order Online” button that sends orders straight to the counter system your kitchen already uses. Uber Eats and DoorDash buttons too.<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background: #FFFFFF; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1F2A24\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 800; font-size: 1.3rem\">Domains, launch &amp; Google<\u002Fh3>\n<p style=\"margin: 0; color: #4B5550\">I’ll help you buy your own domain in your own account, connect it, and turn on the secure padlock (HTTPS) so customers trust your site. I can also set up a professional Google Business Profile with your hours, address, phone, website link and the photos you provide, so you show up on Google Search and Maps.<\u002Fp>\n<p style=\"margin: 0; align-self: flex-start; background: #F7F5EE; border-radius: 999px; padding: 6px 14px; font-size: 0.92rem; font-weight: 600\">Included · optional<\u002Fp>\n<\u002Farticle>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"why\" style=\"background: #FFFFFF; padding: clamp(64px, 8vw, 104px) 0\">\n<div style=\"ma : 0; color: #4B5550\">You know the full price before any work starts, and every extra is listed on this page. No surprise bills.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #F7F5EE; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 10px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1F2A24\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"7\" y=\"2\" width=\"10\" height=\"20\" rx=\"2\"><\u002Frect><path d=\"M11 18h2\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 800; font-size: 1.25rem\">Made for phones<\u002Fh3>\n<p style=\"margin: 0; color: #4B5550\">Most customers will find you on their phone. Every site is mobile-friendly, fast, and easy to read, with strong contrast and descriptions on every image.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #F7F5EE; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 10px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1F2A24\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"11\" rx=\"2\"><\u002Frect><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Archivo, Inter, Arial, sans-serif; font-weight: 800; font-size: 1.25rem\">Safe by design<\u002Fh3>\n<p style=\"margin: 0; color: #4B5550\">Payments and private information always go through trusted services like Payhip, Shopify or Square, never a homemade form.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #F7F5EE; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 10px\">\n<svg aria-hidden=\"true\" width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1F2A24\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"r
